name: Deploy to GitHub Pages

# Deploys the static site to GitHub Pages and injects the Umami website ID
# from a repository secret at build time, so the ID is never committed to source.

on:
  push:
    branches: [main]
  workflow_dispatch:

# No default token permissions; each job requests only what it needs.
# Actions are pinned to full commit SHAs (tag in the trailing comment) so a
# moved or compromised tag cannot change what runs.
permissions: {}

# Allow only one concurrent deployment.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The whole checkout is uploaded as the Pages artifact, so don't leave
          # the job token in .git/config.
          persist-credentials: false

      - name: Inject Umami website ID
        env:
          UMAMI_WEBSITE_ID: ${{ secrets.UMAMI_WEBSITE_ID }}
        run: |
          if [ -n "$UMAMI_WEBSITE_ID" ]; then
            # Replace the placeholder in every HTML file (and main.js if you move it there)
            grep -rl '__UMAMI_WEBSITE_ID__' --include='*.html' --include='*.js' . | while read -r f; do
              sed -i "s/__UMAMI_WEBSITE_ID__/${UMAMI_WEBSITE_ID}/g" "$f"
            done
            echo "Injected Umami website ID into matching files."
          else
            echo "::warning::UMAMI_WEBSITE_ID secret not set — placeholder left in place, analytics disabled."
          fi

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
